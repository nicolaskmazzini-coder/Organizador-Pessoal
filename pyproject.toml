[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hexavante-file-organizer"
version = "0.1.0"
description = "Hexavante File Organizer — organizador seguro de arquivos (desktop Fedora, GTK4/Libadwaita, offline)"
readme = "AGENTS.md"
requires-python = ">=3.10"
license = { text = "Proprietary — uso interno Hexavante v0.1" }
dependencies = []

[project.scripts]
hexavante = "hexavante.main:main"

[project.optional-dependencies]
gui = ["PyGObject>=3.44"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hexavante = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
